<script>
  const stepEase = (base, dur, fps = 12) => {
    const e = gsap.parseEase(base);
    const n = Math.max(1, Math.round(dur * fps));
    return (p) => e(Math.floor(p * n) / n);
  };

  const tl = gsap.timeline({ paused: true });

  // Title
  tl.fromTo("#comp-title", {opacity:0, x:-30}, {opacity:1, x:0, duration:0.5, ease: stepEase("power2.out", 0.5)}, 0.2);

  // Live counter appears
  tl.fromTo("#live-counter", {opacity:0, y:-20}, {opacity:1, y:0, duration:0.4, ease: stepEase("power2.out", 0.4)}, 0.5);

  // Chart fades in
  tl.fromTo("#comp-chart", {opacity:0}, {opacity:1, duration:0.5, ease: stepEase("power2.out", 0.5)}, 1.0);

  // Line draws using stroke-dashoffset
  const lineLen = 2200;
  tl.set("#comp-pf-line", {strokeDasharray: lineLen, strokeDashoffset: lineLen}, 1.0);
  tl.to("#comp-pf-line", {strokeDashoffset: 0, duration: 5.0, ease: "power1.inOut"}, 1.5);

  // Dots pop in as line reaches them
  const dots = ["#dot-15","#dot-16","#dot-17","#dot-18","#dot-19","#dot-20","#dot-21"];
  const dotTimes = [1.8, 2.5, 3.2, 3.9, 4.6, 5.3, 6.0];
  dots.forEach((d, i) => {
    tl.fromTo(d, {r:0}, {r:9, duration:0.2, ease: stepEase("back.out(2)", 0.2)}, dotTimes[i]);
  });

  // Area fill fades in
  tl.to("#comp-area", {opacity:0.12, duration:1.5, ease:"power2.out"}, 4.5);

  // Heartbeat appears at COVID point
  tl.fromTo("#heartbeat", {opacity:0}, {opacity:0.6, duration:0.3}, 5.0);
  tl.to("#heartbeat", {opacity:0, duration:0.5}, 6.0);

  // COVID banner slides in from left
  tl.fromTo("#covid-banner", {opacity:0, x:-200}, {opacity:1, x:0, duration:0.4, ease: stepEase("power3.out", 0.4)}, 6.5);

  // Screen shakes on COVID
  tl.to("#comp-chart", {x:8, duration:0.06, ease:"none"}, 6.5);
  tl.to("#comp-chart", {x:-6, duration:0.06, ease:"none"}, 6.56);
  tl.to("#comp-chart", {x:4, duration:0.06, ease:"none"}, 6.62);
  tl.to("#comp-chart", {x:0, duration:0.06, ease:"none"}, 6.68);

  // COVID banner out
  tl.to("#covid-banner", {opacity:0, x:200, duration:0.3, ease:"power2.in"}, 8.0);

  // Recovery badge pops
  tl.fromTo("#recovery-badge", {opacity:0, scale:0.6}, {opacity:1, scale:1, duration:0.35, ease: stepEase("back.out(1.8)", 0.35)}, 8.5);
  tl.to("#recovery-badge", {opacity:0, duration:0.3}, 9.5);

  // Data row
  tl.fromTo("#comp-row", {opacity:0, y:30}, {opacity:1, y:0, duration:0.5, ease: stepEase("power2.out", 0.5)}, 10.0);

  // Camera drift on chart
  tl.to("#comp-chart", {x:-8, y:-4, duration:12, ease:"none"}, 1.5);

  // Fade out
  tl.to("#root", {opacity:0, duration:0.4, ease:"power2.in"}, 14.4);
  tl.set("#root", {opacity:0, visibility:"hidden"}, 14.8);

  window.__timelines["compound"] = tl;
</script>
