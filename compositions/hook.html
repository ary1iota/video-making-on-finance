<script>
  const stepEase = (base, dur, fps = 12) => {
    const e = gsap.parseEase(base);
    const n = Math.max(1, Math.round(dur * fps));
    return (p) => e(Math.floor(p * n) / n);
  };

  const tl = gsap.timeline({ paused: true });

  // ═══════ INSTANT: Grid + particles fade in (0.0s) ═══════
  tl.fromTo("#bg-grid", {opacity:0}, {opacity:1, duration:0.3, ease:"power2.out"}, 0);

  // Floating particles — all start immediately, drift continuously
  const particles = ["#p1","#p2","#p3","#p4","#p5","#p6","#p7","#p8","#p9","#p10","#p11","#p12"];
  const pDriftY = [-80, 90, -60, 70, -100, 80, -50, -70, 60, -90, 50, -80];
  const pDriftX = [30, -40, 50, -30, 20, -50, 40, -20, 35, -45, 25, -35];
  particles.forEach((p, i) => {
    tl.fromTo(p, {opacity:0}, {opacity: 0.4 + Math.random()*0.3, duration:0.3}, i * 0.04);
    tl.to(p, {y: pDriftY[i], x: pDriftX[i], duration: 7.5, ease:"none"}, 0.2);
  });

  // ═══════ FLASH: Attention bars (0.1s) ═══════
  tl.fromTo("#fb1", {opacity:0, scaleY:0}, {opacity:0.4, scaleY:1, duration:0.08, transformOrigin:"top"}, 0.1);
  tl.fromTo("#fb2", {opacity:0, scaleY:0}, {opacity:0.4, scaleY:1, duration:0.08, transformOrigin:"bottom"}, 0.12);
  tl.fromTo("#fb3", {opacity:0, scaleX:0}, {opacity:0.3, scaleX:1, duration:0.06, transformOrigin:"left"}, 0.15);
  tl.to("#fb1", {opacity:0, duration:0.3}, 0.4);
  tl.to("#fb2", {opacity:0, duration:0.3}, 0.42);
  tl.to("#fb3", {opacity:0, duration:0.25}, 0.4);

  // Glitch lines flash rapidly
  tl.fromTo("#gl1", {opacity:0, scaleX:0}, {opacity:0.8, scaleX:1, duration:0.04}, 0.12);
  tl.to("#gl1", {opacity:0, duration:0.1}, 0.2);
  tl.fromTo("#gl2", {opacity:0, scaleX:0}, {opacity:0.6, scaleX:1, duration:0.04}, 0.16);
  tl.to("#gl2", {opacity:0, duration:0.1}, 0.24);
  tl.fromTo("#gl3", {opacity:0, scaleX:0}, {opacity:0.7, scaleX:1, duration:0.04}, 0.14);
  tl.to("#gl3", {opacity:0, duration:0.1}, 0.22);
  tl.fromTo("#gl4", {opacity:0, scaleX:0}, {opacity:0.5, scaleX:1, duration:0.04}, 0.18);
  tl.to("#gl4", {opacity:0, duration:0.1}, 0.26);

  // ═══════ STOP TEXT: Pattern interrupt (0.2s) ═══════
  tl.fromTo("#stop-text", {opacity:0, scale:1.8, y:-10}, {opacity:1, scale:1, y:0, duration:0.15, ease: stepEase("back.out(2)", 0.15)}, 0.2);

  // Glitch flash on stop text
  tl.to("#stop-text", {x:5, duration:0.03}, 0.5);
  tl.to("#stop-text", {x:-3, duration:0.03}, 0.53);
  tl.to("#stop-text", {x:0, duration:0.03}, 0.56);

  // Stop text fades out
  tl.to("#stop-text", {opacity:0, y:-30, scale:0.9, duration:0.25, ease:"power2.in"}, 1.2);

  // ═══════ PULSE RINGS: Expand outward (0.5s) ═══════
  tl.fromTo("#pr1", {opacity:0, scale:0.2}, {opacity:0.4, scale:1, duration:0.5, ease:"power2.out"}, 0.5);
  tl.fromTo("#pr2", {opacity:0, scale:0.2}, {opacity:0.3, scale:1, duration:0.6, ease:"power2.out"}, 0.6);
  tl.fromTo("#pr3", {opacity:0, scale:0.2}, {opacity:0.2, scale:1, duration:0.7, ease:"power2.out"}, 0.7);
  tl.fromTo("#pr4", {opacity:0, scale:0.2}, {opacity:0.1, scale:1, duration:0.8, ease:"power2.out"}, 0.8);

  // Continuous pulse breathing
  tl.to("#pr1", {scale:1.15, opacity:0.2, duration:2, ease:"sine.inOut", repeat:2, yoyo:true}, 1.5);
  tl.to("#pr2", {scale:1.1, opacity:0.15, duration:2.5, ease:"sine.inOut", repeat:1, yoyo:true}, 1.8);

  // ═══════ GLOW (0.6s) ═══════
  tl.fromTo("#glow", {opacity:0, scale:0.3}, {opacity:1, scale:1, duration:0.5, ease:"power2.out"}, 0.6);
  // Glow pulses continuously
  tl.to("#glow", {scale:1.2, opacity:0.6, duration:1.5, ease:"sine.inOut", repeat:3, yoyo:true}, 1.5);

  // ═══════ CHART: Background silhouette draws itself (0.5s) ═══════
  tl.fromTo("#chart-bg", {opacity:0}, {opacity:1, duration:0.3}, 0.5);
  tl.to("#chart-path", {strokeDashoffset: 0, duration:4, ease:"power1.inOut"}, 0.8);

  // ═══════ COIN RAIN: Staggered (0.3s) ═══════
  const coins = ["#c1","#c2","#c3","#c4","#c5","#c6","#c7","#c8","#c9","#c10","#c11","#c12"];
  const coinEndY = [300, 250, 380, 320, 450, 220, 360, 280, 400, 200, 340, 260];
  const coinRot = [40, -30, 55, -45, 35, -55, 50, -40, 30, -50, 45, -35];
  coins.forEach((c, i) => {
    const delay = 0.3 + i * 0.05;
    tl.fromTo(c, {opacity:0, y:0, rotation:0, scale:0.5},
      {opacity:0.5, y: coinEndY[i], rotation: coinRot[i], scale:1, duration:0.35, ease: stepEase("power2.out", 0.35)}, delay);
  });
  // Coins keep drifting
  coins.forEach((c, i) => {
    tl.to(c, {y: coinEndY[i] + 100, rotation: coinRot[i] + 15, opacity: 0.25, duration:5, ease:"none"}, 1.5);
  });

  // ═══════ ₹10,000 SLAMS IN (1.5s) — "ten thousand rupees" ═══════
  tl.fromTo("#hook-amount", {opacity:0, scale:3, rotation:-5},
    {opacity:1, scale:1, rotation:0, duration:0.25, ease: stepEase("back.out(2.5)", 0.25)}, 1.5);

  // Underline draws fast
  tl.to("#underline", {width:540, duration:0.25, ease: stepEase("power3.out", 0.25)}, 1.85);

  // Amount energy pulse
  tl.to("#hook-amount", {scale:1.08, textShadow:"0 0 120px rgba(255,230,25,0.6)", duration:0.4, ease:"sine.inOut"}, 2.2);
  tl.to("#hook-amount", {scale:1.0, textShadow:"0 0 80px rgba(255,230,25,0.4)", duration:0.4, ease:"sine.inOut"}, 2.6);

  // Second pulse
  tl.to("#hook-amount", {scale:1.05, duration:0.3, ease:"sine.inOut"}, 3.8);
  tl.to("#hook-amount", {scale:1.0, duration:0.3, ease:"sine.inOut"}, 4.1);

  // Subtle rotation sway
  tl.to("#hook-amount", {rotation:1.5, duration:1.5, ease:"sine.inOut"}, 3.0);
  tl.to("#hook-amount", {rotation:-1, duration:1.5, ease:"sine.inOut"}, 4.5);
  tl.to("#hook-amount", {rotation:0, duration:1, ease:"sine.inOut"}, 6.0);

  // ═══════ PER YEAR (2.5s) — "every year" ═══════
  tl.fromTo("#per-year", {opacity:0, y:25, letterSpacing:"0.3em"},
    {opacity:1, y:0, letterSpacing:"0.1em", duration:0.3, ease: stepEase("power2.out", 0.3)}, 2.5);

  // ═══════ YEAR STRIP (3.5s) — "in the Nifty 50" ═══════
  tl.fromTo("#year-strip", {opacity:0, y:20},
    {opacity:1, y:0, duration:0.35, ease: stepEase("power2.out", 0.35)}, 3.5);

  // Second glitch burst
  tl.fromTo("#gl1", {opacity:0, scaleX:0}, {opacity:0.5, scaleX:1, duration:0.04}, 3.2);
  tl.to("#gl1", {opacity:0, duration:0.08}, 3.28);
  tl.fromTo("#gl3", {opacity:0, scaleX:0}, {opacity:0.4, scaleX:1, duration:0.04}, 3.25);
  tl.to("#gl3", {opacity:0, duration:0.08}, 3.33);

  // Flash bars second burst
  tl.fromTo("#fb1", {opacity:0}, {opacity:0.2, duration:0.05}, 3.3);
  tl.to("#fb1", {opacity:0, duration:0.15}, 3.4);
  tl.fromTo("#fb2", {opacity:0}, {opacity:0.2, duration:0.05}, 3.32);
  tl.to("#fb2", {opacity:0, duration:0.15}, 3.42);

  // ═══════ QUESTION (4.8s) — "Let's find out" ═══════
  tl.fromTo("#hook-question", {opacity:0, y:60, scale:0.95},
    {opacity:1, y:0, scale:1, duration:0.4, ease: stepEase("power2.out", 0.4)}, 4.8);

  // ═══════ CONTINUOUS GRID DRIFT ═══════
  tl.to("#bg-grid", {backgroundPosition:"40px 40px", duration:7.5, ease:"none"}, 0.3);

  // ═══════ ZOOM PULL at end (6.5s) — everything scales subtly ═══════
  tl.to("#hook-amount", {scale:1.15, duration:1.2, ease:"power2.in"}, 6.2);
  tl.to("#per-year", {scale:1.05, opacity:0.7, duration:1.0, ease:"power2.in"}, 6.3);
  tl.to("#year-strip", {scale:0.95, opacity:0.5, duration:1.0, ease:"power2.in"}, 6.3);
  tl.to("#hook-question", {y:-15, opacity:0.6, duration:1.0, ease:"power2.in"}, 6.4);

  // Third glitch burst before exit
  tl.fromTo("#gl2", {opacity:0, scaleX:0}, {opacity:0.6, scaleX:1, duration:0.03}, 6.8);
  tl.to("#gl2", {opacity:0, duration:0.06}, 6.86);
