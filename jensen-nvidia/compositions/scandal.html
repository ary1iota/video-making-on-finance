<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="../assets/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #root {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #1A1A1A; position: relative;
    font-family: 'Inter', sans-serif;
  }
  .inner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }

  /* Timeline vertical line */
  #timeline-line {
    position: absolute; top: 120px; left: 960px;
    width: 4px; height: 0; background: #FFE619;
    transform: translateX(-50%);
  }

  /* Timeline cards */
  .timeline-card {
    position: absolute; width: 680px; padding: 36px 44px;
    background: #2a2a2a; border-radius: 16px;
    border-left: 6px solid #FFE619; opacity: 0;
  }
  .timeline-card.right { left: 1000px; }
  .timeline-card.left { left: 200px; }
  .card-label {
    font-size: 20px; color: #FFE619; text-transform: uppercase;
    letter-spacing: 0.15em; font-weight: 700; margin-bottom: 12px;
    font-family: 'Space Mono', monospace;
  }
  .card-title {
    font-size: 38px; color: #ffffff; font-weight: 700;
    font-family: 'Archivo Black', sans-serif; margin-bottom: 10px;
  }
  .card-detail {
    font-size: 24px; color: #b0b5ba; line-height: 1.4;
  }
  .card-emoji {
    font-size: 48px; position: absolute; top: 30px; right: 30px;
  }

  /* Card 1: Spy affair */
  #card-spy { top: 130px; left: 1000px; width: 680px; height: 230px; }
  #card-spy .timeline-card { border-left-color: #E74C3C; }

  /* Card 2: VP affair */
  #card-vp { top: 390px; left: 200px; width: 680px; height: 230px; }
  #card-vp .timeline-card { border-left-color: #E74C3C; }

  /* Card 3: Resignation */
  #card-resign { top: 650px; left: 1000px; width: 680px; height: 230px; }
  #card-resign .timeline-card { border-left-color: #FFE619; }

  /* Dot markers on timeline */
  .timeline-dot {
    position: absolute; left: 960px; transform: translate(-50%, -50%);
    width: 24px; height: 24px; border-radius: 50%;
    background: #FFE619; opacity: 0;
  }
  #dot1 { top: 220px; background: #E74C3C; }
  #dot2 { top: 480px; background: #E74C3C; }
  #dot3 { top: 740px; background: #FFE619; }

  /* Board stamp */
  #board-stamp {
    position: absolute; bottom: 60px; right: 120px;
    font-size: 42px; color: #E74C3C; font-weight: 700;
    font-family: 'Archivo Black', sans-serif;
    border: 5px solid #E74C3C; padding: 16px 32px;
    opacity: 0;
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* Scene title */
  #scene-title {
    position: absolute; top: 40px; left: 120px;
    font-size: 28px; color: #b0b5ba; text-transform: uppercase;
    letter-spacing: 0.2em; font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body>
<div id="root" data-composition-id="scandal" data-start="0" data-duration="16.8" data-width="1920" data-height="1080">
  <div class="inner" id="scene-inner">
    <div id="scene-title">THE SCANDAL</div>
    <div id="timeline-line"></div>

    <!-- Timeline dots -->
    <div class="timeline-dot" id="dot1"></div>
    <div class="timeline-dot" id="dot2"></div>
    <div class="timeline-dot" id="dot3"></div>

    <!-- Card 1: Spy affair (right side) -->
    <div id="card-spy" style="position:absolute;">
      <div class="timeline-card" style="position:relative; left:0; top:0;">
        <div class="card-label">AFFAIR #1</div>
        <div class="card-title">Alice Huang</div>
        <div class="card-detail">Chinese executive at Megaspeed.<br>U.S. intelligence says: suspected spy.</div>
        <div class="card-emoji">🕵️</div>
      </div>
    </div>

    <!-- Card 2: VP affair (left side) -->
    <div id="card-vp" style="position:absolute;">
      <div class="timeline-card" style="position:relative; left:0; top:0;">
        <div class="card-label">AFFAIR #2</div>
        <div class="card-title">His Own VP</div>
        <div class="card-detail">Kimberly Powell, VP of Healthcare.<br>She reported directly to him.</div>
        <div class="card-emoji">💼</div>
      </div>
    </div>

    <!-- Card 3: Resignation (right side) -->
    <div id="card-resign" style="position:absolute;">
      <div class="timeline-card" style="position:relative; left:0; top:0;">
        <div class="card-label">NOV 12, 2026</div>
        <div class="card-title">Jensen Resigns</div>
        <div class="card-detail">After 33 years as CEO.<br>Effective immediately.</div>
        <div class="card-emoji">📉</div>
      </div>
    </div>

    <!-- Board stamp -->
    <div id="board-stamp">THE BOARD DIDN'T FIGHT IT</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// Fade in
tl.to("#scene-inner", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

// Scene title
tl.fromTo("#scene-title", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.2);

// Timeline line grows
tl.to("#timeline-line", { height: 700, duration: 12, ease: "none" }, 0.5);

// Card 1: Spy affair (at ~1s into scene)
tl.to("#dot1", { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.0);
tl.fromTo("#dot1", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.0);
tl.fromTo("#card-spy .timeline-card", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.2);

// Card 2: VP affair (at ~5s into scene)
tl.to("#dot2", { opacity: 1, duration: 0.2, ease: "power2.out" }, 5.0);
tl.fromTo("#dot2", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 5.0);
tl.fromTo("#card-vp .timeline-card",
  { opacity: 0, x: -60 },
  { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
  5.2
);

// Card 3: Resignation (at ~9s into scene)
tl.to("#dot3", { opacity: 1, duration: 0.2, ease: "power2.out" }, 9.0);
tl.fromTo("#dot3", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 9.0);
tl.fromTo("#card-resign .timeline-card", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 9.2);

// Board stamp slams in
tl.fromTo("#board-stamp", { scale: 0, rotation: -20, opacity: 0 }, { scale: 1, rotation: -8, opacity: 1, duration: 0.2, ease: "power4.out" }, 13.5);

// Fade out
tl.to("#scene-inner", { opacity: 0, duration: 0.4, ease: "power2.in" }, 16.2);

// Hard kill
tl.set("#root", { opacity: 0, visibility: "hidden" }, 16.7);

window.__timelines["scandal"] = tl;
</script>
</body>
</html>
