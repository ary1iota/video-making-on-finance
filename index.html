<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #fbfaf8;
        --ink: #1a1a1a;
        --yellow: #FFE619;
        --blue: #66CFFF;
        --specimen-blue: #58BCEC;
        --grey-light: #F2F2F2;
        --grey-mid: #8d9399;
        --grey-border: #E9E9EB;
        --font-display: 'Archivo Black', sans-serif;
        --font-body: 'Inter', sans-serif;
        --font-serif: 'EB Garamond', Georgia, serif;
        --font-mono: 'Space Mono', monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="85"
         data-width="1920" data-height="1080">

      <!-- Scene 1: Hook — The ₹10,000 question (0-8s) -->
      <div id="hook" data-composition-id="hook"
           data-composition-src="compositions/hook.html"
           data-start="0" data-duration="8"
           data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Scene 2: The Early Years 2006-2008 (8-26s) -->
      <div id="early" data-composition-id="early"
           data-composition-src="compositions/early.html"
           data-start="8" data-duration="18"
           data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Scene 3: Recovery & Growth 2009-2014 (26-38s) -->
      <div id="recovery" data-composition-id="recovery"
           data-composition-src="compositions/recovery.html"
           data-start="26" data-duration="12"
           data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Scene 4: The Compounding Machine 2015-2021 (38-53s) -->
      <div id="compound" data-composition-id="compound"
           data-composition-src="compositions/compound.html"
           data-start="38" data-duration="15"
           data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Scene 5: Investment Summary + Lifestyle Changes (53-67s) -->
      <div id="structure" data-composition-id="structure"
           data-composition-src="compositions/structure.html"
           data-start="53" data-duration="14"
           data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Scene 6: Final Reveal — ₹2L → ₹7.6L (67-77s) -->
      <div id="reveal" data-composition-id="reveal"
           data-composition-src="compositions/reveal.html"
           data-start="67" data-duration="10"
           data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Scene 7: Close (77-85s) -->
      <div id="close" data-composition-id="close"
           data-composition-src="compositions/close.html"
           data-start="77" data-duration="8"
           data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- ═══════════ AUDIO: Voiceover Narration ═══════════ -->
      <audio id="voice-narration" src="assets/voice/narration.wav"
             data-start="0.5" data-duration="84.2"
             data-volume="0.85" data-fade-in="0.3" data-fade-out="0.5"
             data-track-index="0" data-track-kind="voice"></audio>

      <!-- ═══════════ AUDIO: Sound Effects (ducked under voice) ═══════════ -->
      <hf-audio-group id="sfx"></hf-audio-group>

      <!-- Scene 1: Hook (0-12s) -->
      <audio id="sfx-hook-whoosh" src="assets/sfx/whoosh.mp3"
             data-start="0.1" data-duration="0.57"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-hook-impact" src="assets/sfx/impact-bass-1.mp3"
             data-start="0.8" data-duration="2.12"
             data-volume="0.25" data-fade-in="0" data-fade-out="0.3"
             data-audio-group="sfx"></audio>
      <audio id="sfx-hook-pop" src="assets/sfx/pop.mp3"
             data-start="3.2" data-duration="0.72"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>

      <!-- Scene 2: Early Years (8-26s) -->
      <audio id="sfx-early-whoosh" src="assets/sfx/whoosh-short.mp3"
             data-start="8.0" data-duration="0.57"
             data-volume="0.25" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-early-pop1" src="assets/sfx/pop.mp3"
             data-start="9.5" data-duration="0.72"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-early-pop2" src="assets/sfx/pop.mp3"
             data-start="13.2" data-duration="0.72"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-crash-impact" src="assets/sfx/impact-bass-2.mp3"
             data-start="19.2" data-duration="2.59"
             data-volume="0.3" data-fade-in="0" data-fade-out="0.4"
             data-audio-group="sfx"></audio>
      <audio id="sfx-crash-error" src="assets/sfx/error.mp3"
             data-start="19.7" data-duration="1.62"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.2"
             data-audio-group="sfx"></audio>

      <!-- Scene 3: Recovery (26-38s) -->
      <audio id="sfx-recovery-whoosh" src="assets/sfx/whoosh.mp3"
             data-start="26.0" data-duration="0.57"
             data-volume="0.25" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-recovery-pop1" src="assets/sfx/pop.mp3"
             data-start="27.5" data-duration="0.72"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-recovery-sparkle" src="assets/sfx/sparkle.mp3"
             data-start="29.0" data-duration="1.80"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.3"
             data-audio-group="sfx"></audio>
      <audio id="sfx-recovery-pop2" src="assets/sfx/pop.mp3"
             data-start="31.5" data-duration="0.72"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>

      <!-- Scene 4: Compounding (38-53s) -->
      <audio id="sfx-compound-whoosh" src="assets/sfx/whoosh-short.mp3"
             data-start="38.0" data-duration="0.57"
             data-volume="0.25" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-covid-impact" src="assets/sfx/impact-bass-1.mp3"
             data-start="44.0" data-duration="2.12"
             data-volume="0.3" data-fade-in="0" data-fade-out="0.3"
             data-audio-group="sfx"></audio>
      <audio id="sfx-recovery-badge" src="assets/sfx/sparkle.mp3"
             data-start="47.0" data-duration="1.80"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.3"
             data-audio-group="sfx"></audio>

      <!-- Scene 5: Summary + Lifestyle (53-67s) -->
      <audio id="sfx-summary-whoosh" src="assets/sfx/whoosh.mp3"
             data-start="53.0" data-duration="0.57"
             data-volume="0.25" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-summary-pop1" src="assets/sfx/pop.mp3"
             data-start="54.5" data-duration="0.72"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-summary-pop2" src="assets/sfx/pop.mp3"
             data-start="56.0" data-duration="0.72"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-lifestyle-ping" src="assets/sfx/ping.mp3"
             data-start="58.5" data-duration="1.32"
             data-volume="0.15" data-fade-in="0" data-fade-out="0.2"
             data-audio-group="sfx"></audio>

      <!-- Riser building to reveal (peak at ~67s) -->
      <audio id="sfx-riser" src="assets/sfx/riser.mp3"
             data-start="57.0" data-duration="10.03"
             data-volume="0.2" data-fade-in="1.0" data-fade-out="0"
             data-audio-group="sfx"></audio>

      <!-- Scene 6: Reveal (67-77s) -->
      <audio id="sfx-reveal-impact" src="assets/sfx/impact-bass-2.mp3"
             data-start="67.1" data-duration="2.59"
             data-volume="0.3" data-fade-in="0" data-fade-out="0.4"
             data-audio-group="sfx"></audio>
      <audio id="sfx-reveal-sparkle" src="assets/sfx/sparkle.mp3"
             data-start="69.5" data-duration="1.80"
             data-volume="0.25" data-fade-in="0" data-fade-out="0.3"
             data-audio-group="sfx"></audio>
      <audio id="sfx-confetti-ping" src="assets/sfx/ping.mp3"
             data-start="71.0" data-duration="1.32"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.2"
             data-audio-group="sfx"></audio>

      <!-- Scene 7: Close (77-85s) -->
      <audio id="sfx-close-whoosh" src="assets/sfx/whoosh-short.mp3"
             data-start="77.0" data-duration="0.57"
             data-volume="0.25" data-fade-in="0" data-fade-out="0.1"
             data-audio-group="sfx"></audio>
      <audio id="sfx-close-click1" src="assets/sfx/click-soft.mp3"
             data-start="77.5" data-duration="0.37"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.05"
             data-audio-group="sfx"></audio>
      <audio id="sfx-close-click2" src="assets/sfx/click-soft.mp3"
             data-start="78.2" data-duration="0.37"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.05"
             data-audio-group="sfx"></audio>
      <audio id="sfx-close-slam" src="assets/sfx/impact-bass-1.mp3"
             data-start="78.7" data-duration="2.12"
             data-volume="0.3" data-fade-in="0" data-fade-out="0.3"
             data-audio-group="sfx"></audio>
      <audio id="sfx-close-chime" src="assets/sfx/chime.mp3"
             data-start="82.0" data-duration="2.50"
             data-volume="0.2" data-fade-in="0" data-fade-out="0.8"
             data-audio-group="sfx"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
