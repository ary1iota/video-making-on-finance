<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="../assets/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #root {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #1A1A1A; position: relative;
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
  }
  .inner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }

  /* NVIDIA green glow */
  #nvidia-glow {
    position: absolute; bottom: -100px; left: 80px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(118,185,0,0.25) 0%, rgba(118,185,0,0) 70%);
    border-radius: 50%;
  }

  /* Jensen SVG container */
  #jensen-char {
    position: absolute; bottom: 30px; left: 80px;
    width: 480px; height: 800px;
  }

  /* Big number */
  #trillion-number {
    position: absolute; top: 140px; right: 140px;
    font-size: 180px; color: #ffffff; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums; opacity: 0;
  }
  #trillion-label {
    position: absolute; top: 340px; right: 140px;
    font-size: 40px; color: #b0b5ba; letter-spacing: 0.12em;
    text-transform: uppercase; font-family: 'Space Mono', monospace; opacity: 0;
  }
  #accent-line {
    position: absolute; top: 310px; right: 140px;
    width: 0; height: 5px; background: #76B900;
  }

  /* Cheating text */
  #cheat-text {
    position: absolute; top: 180px; right: 120px;
    font-size: 72px; color: #FFE619; text-transform: uppercase;
    letter-spacing: -0.02em; opacity: 0; text-align: right;
    line-height: 1.1;
  }

  /* Counter */
  #count-container {
    position: absolute; top: 140px; left: 50%;
    text-align: center; opacity: 0;
  }
  #count-number {
    font-size: 260px; color: #E74C3C; line-height: 0.9;
  }
  #count-label {
    font-size: 52px; color: #ffffff; letter-spacing: 0.06em;
    text-transform: uppercase; margin-top: -10px;
  }

  /* Spy reveal */
  #spy-text {
    position: absolute; top: 440px; left: 50%;
    font-size: 64px; color: #E74C3C; text-transform: uppercase;
    letter-spacing: 0.04em; opacity: 0; white-space: nowrap;
  }

  /* Spy silhouette */
  #spy-mini {
    position: absolute; bottom: 80px; right: 200px;
    opacity: 0;
  }

  /* Story title bar */
  #story-bar {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 180px;
    background: #E74C3C;
  }
  #story-text {
    position: absolute; top: 50%; left: 50%;
    font-size: 58px; color: #ffffff; text-transform: uppercase;
    letter-spacing: 0.06em; white-space: nowrap;
  }

  /* Flash */
  #flash-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #ffffff; opacity: 0; pointer-events: none;
  }

  /* Sweat drops */
  .sweat {
    position: absolute; width: 14px; height: 20px;
    background: #66CFFF; border-radius: 50% 50% 50% 20%;
    opacity: 0;
  }
  #sweat1 { left: 240px; top: 200px; }
  #sweat2 { left: 380px; top: 170px; }
  #sweat3 { left: 310px; top: 150px; }
</style>
</head>
<body>
<div id="root" data-composition-id="hook" data-start="0" data-duration="10.5" data-width="1920" data-height="1080">
  <div class="inner" id="scene-inner">

    <div id="nvidia-glow"></div>

    <!-- Jensen character SVG -->
    <div id="jensen-char">
      <svg viewBox="0 0 420 720" width="480" height="800">
        <g id="j-legs">
          <rect x="135" y="520" width="50" height="140" rx="10" fill="#2a2a2a"/>
          <rect x="235" y="520" width="50" height="140" rx="10" fill="#2a2a2a"/>
          <ellipse cx="160" cy="660" rx="38" ry="14" fill="#111"/>
          <ellipse cx="260" cy="660" rx="38" ry="14" fill="#111"/>
        </g>
        <g id="j-body">
          <path d="M110,240 L95,530 L325,530 L310,240 C300,195 260,175 210,175 C160,175 120,195 110,240Z" fill="#2a2a2a"/>
          <path d="M155,250 L148,510 L195,510 L200,250Z" fill="#333" opacity="0.5"/>
          <path d="M120,245 L165,295 L185,265 L150,215Z" fill="#333"/>
          <path d="M300,245 L255,295 L235,265 L270,215Z" fill="#333"/>
          <line x1="210" y1="285" x2="210" y2="520" stroke="#444" stroke-width="2.5"/>
          <circle cx="210" cy="295" r="5" fill="#555"/>
        </g>
        <g id="j-arms">
          <g id="j-arm-l">
            <path d="M108,255 L55,430" stroke="#2a2a2a" stroke-width="34" stroke-linecap="round"/>
            <circle cx="52" cy="438" r="20" fill="#D4A574"/>
          </g>
          <g id="j-arm-r">
            <path d="M312,255 L365,430" stroke="#2a2a2a" stroke-width="34" stroke-linecap="round"/>
            <circle cx="368" cy="438" r="20" fill="#D4A574"/>
          </g>
        </g>
        <g id="j-head">
          <rect x="185" y="155" width="50" height="35" rx="8" fill="#D4A574"/>
          <ellipse cx="210" cy="105" rx="72" ry="82" fill="#D4A574"/>
          <ellipse cx="140" cy="112" rx="13" ry="18" fill="#C49A6C"/>
          <ellipse cx="280" cy="112" rx="13" ry="18" fill="#C49A6C"/>
          <path d="M138,98 C138,52 165,18 210,12 C255,18 282,52 282,98
                   L275,82 L264,98 L253,78 L242,98 L231,72 L220,98
                   L210,68 L200,98 L189,72 L178,98 L167,78 L156,98 L145,82 Z" fill="#9a9a9a"/>
          <g id="j-glasses">
            <rect x="157" y="92" width="40" height="32" rx="5" fill="rgba(200,220,255,0.12)" stroke="#333" stroke-width="3.5"/>
            <rect x="223" y="92" width="40" height="32" rx="5" fill="rgba(200,220,255,0.12)" stroke="#333" stroke-width="3.5"/>
            <line x1="197" y1="108" x2="223" y2="108" stroke="#333" stroke-width="3.5"/>
            <line x1="157" y1="103" x2="142" y2="103" stroke="#333" stroke-width="2.5"/>
            <line x1="263" y1="103" x2="278" y2="103" stroke="#333" stroke-width="2.5"/>
          </g>
          <g id="j-eyes-normal">
            <circle cx="177" cy="108" r="7" fill="#1a1a1a"/>
            <circle cx="243" cy="108" r="7" fill="#1a1a1a"/>
            <circle cx="179" cy="106" r="2.8" fill="#fff"/>
            <circle cx="245" cy="106" r="2.8" fill="#fff"/>
          </g>
          <g id="j-eyes-shocked" opacity="0">
            <ellipse cx="177" cy="108" rx="16" ry="18" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
            <circle cx="177" cy="110" r="7" fill="#1a1a1a"/>
            <circle cx="179" cy="107" r="2.5" fill="#fff"/>
            <ellipse cx="243" cy="108" rx="16" ry="18" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
            <circle cx="243" cy="110" r="7" fill="#1a1a1a"/>
            <circle cx="245" cy="107" r="2.5" fill="#fff"/>
          </g>
          <path id="j-mouth-smirk" d="M185,140 Q210,155 235,140" fill="none" stroke="#8B4513" stroke-width="3.5" stroke-linecap="round"/>
          <ellipse id="j-mouth-shocked" cx="210" cy="148" rx="16" ry="20" fill="#5C3310" stroke="#4A2508" stroke-width="2" opacity="0"/>
          <g id="j-brows">
            <line id="j-brow-l" x1="158" y1="82" x2="195" y2="79" stroke="#7a7a7a" stroke-width="5" stroke-linecap="round"/>
            <line id="j-brow-r" x1="225" y1="79" x2="262" y2="82" stroke="#7a7a7a" stroke-width="5" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="sweat" id="sweat1"></div>
    <div class="sweat" id="sweat2"></div>
    <div class="sweat" id="sweat3"></div>

    <!-- Phase 1: Trillion text -->
    <div id="trillion-number">$3.4T</div>
    <div id="trillion-label">COMPANY</div>
    <div id="accent-line"></div>

    <!-- Phase 2: Cheating text -->
    <div id="cheat-text">CHEATED ON<br>HIS WIFE.</div>

    <!-- Phase 3: Counter -->
    <div id="count-container">
      <div id="count-number">3</div>
      <div id="count-label">TIMES</div>
    </div>

    <!-- Phase 4: Spy text -->
    <div id="spy-text">🕵️ ONE WAS A SPY</div>

    <!-- Spy mini silhouette -->
    <div id="spy-mini">
      <svg viewBox="0 0 120 260" width="100" height="220">
        <ellipse cx="60" cy="40" rx="35" ry="30" fill="#E74C3C" opacity="0.15"/>
        <path d="M20,35 L100,35 L90,18 Q60,2 30,18 Z" fill="#E74C3C" opacity="0.2"/>
        <rect x="10" y="33" width="100" height="6" rx="2" fill="#E74C3C" opacity="0.15"/>
        <path d="M30,55 L22,230 L98,230 L90,55 C82,45 70,42 60,42 C50,42 38,45 30,55Z" fill="#E74C3C" opacity="0.15"/>
        <rect x="40" y="37" width="14" height="9" rx="2" fill="#E74C3C" opacity="0.4"/>
        <rect x="66" y="37" width="14" height="9" rx="2" fill="#E74C3C" opacity="0.4"/>
        <text x="60" y="165" text-anchor="middle" font-size="50" fill="#E74C3C" font-family="Archivo Black, sans-serif" opacity="0.5">?</text>
      </svg>
    </div>

    <!-- Story bar -->
    <div id="story-bar">
      <div id="story-text">THE JENSEN HUANG STORY</div>
    </div>

    <div id="flash-overlay"></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// --- Initial states ---
gsap.set("#story-bar", { y: 200 });
gsap.set("#story-text", { xPercent: -50, yPercent: -50 });
gsap.set("#jensen-char", { y: 120, opacity: 0 });
gsap.set("#count-container", { xPercent: -50 });
gsap.set("#spy-text", { xPercent: -50 });

// --- PHASE 1: $3.4T COMPANY (0-2.5s) ---
tl.to("#scene-inner", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

// Jensen rises in confidently
tl.to("#jensen-char", { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.1);
tl.fromTo("#nvidia-glow", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0.2);

// "$3.4T" slams in
tl.to("#trillion-number", { opacity: 1, duration: 0.1 }, 0.5);
tl.fromTo("#trillion-number", { scale: 1.4 }, { scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 0.5);

// Green accent line wipes
tl.to("#accent-line", { width: 380, duration: 0.4, ease: "power2.inOut" }, 1.0);

// "COMPANY" label
tl.to("#trillion-label", { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.2);

// Jacket collar adjust (confident gesture)
tl.to("#j-arm-r", { rotation: -6, transformOrigin: "50% 0%", duration: 0.35, ease: "power2.inOut" }, 0.8);
tl.to("#j-arm-r", { rotation: 0, duration: 0.3, ease: "power2.inOut" }, 1.15);

// --- PHASE 2: CHEATED ON HIS WIFE (2.5-4.5s) ---

// Trillion text fades
tl.to("#trillion-number, #trillion-label, #accent-line", { opacity: 0, duration: 0.2 }, 2.4);

// "CHEATED ON HIS WIFE" punches in
tl.to("#cheat-text", { opacity: 1, duration: 0.12 }, 2.6);
tl.fromTo("#cheat-text", { scale: 1.2 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.6);

// Glow shifts to warning amber
tl.to("#nvidia-glow", {
  background: "radial-gradient(circle, rgba(255,200,0,0.3) 0%, rgba(255,200,0,0) 70%)",
  duration: 0.01
}, 2.6);

// Jensen's smirk widens slightly (nervous)
tl.to("#j-mouth-smirk", { attr: { d: "M185,140 Q210,158 235,140" }, duration: 0.2 }, 2.6);

// --- PHASE 3: THREE TIMES counter (4.5-6s) ---

// Cheat text fades
tl.to("#cheat-text", { opacity: 0, duration: 0.2 }, 4.3);

// Jensen fades a bit
tl.to("#jensen-char", { opacity: 0.4, duration: 0.3 }, 4.4);

// Counter appears - shows "3 TIMES"
tl.to("#count-container", { opacity: 1, duration: 0.1 }, 4.6);
tl.fromTo("#count-container", { scale: 0.5 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 4.6);

// Number pulses red
tl.fromTo("#count-number", { color: "#ffffff" }, { color: "#E74C3C", duration: 0.01 }, 4.8);
tl.fromTo("#count-number", { scale: 1 }, { scale: 1.15, duration: 0.15, ease: "power2.out" }, 4.8);
tl.to("#count-number", { scale: 1, duration: 0.15, ease: "power2.in" }, 4.95);

// --- PHASE 4: ONE WAS A SPY (6-8s) ---

// Counter fades
tl.to("#count-container", { opacity: 0, duration: 0.2 }, 5.9);

// Jensen reappears, glow goes red
tl.to("#jensen-char", { opacity: 1, duration: 0.2 }, 6.0);
tl.to("#nvidia-glow", {
  background: "radial-gradient(circle, rgba(231,76,60,0.35) 0%, rgba(231,76,60,0) 70%)",
  duration: 0.01
}, 6.0);

// Spy text with emoji
tl.to("#spy-text", { opacity: 1, duration: 0.15, ease: "power2.out" }, 6.1);
tl.fromTo("#spy-text", { y: 30 }, { y: 0, duration: 0.3, ease: "power3.out" }, 6.1);

// Spy silhouette fades in
tl.to("#spy-mini", { opacity: 1, duration: 0.6, ease: "power2.out" }, 6.3);

// SHOCKED expression on Jensen
tl.to("#j-eyes-normal", { opacity: 0, duration: 0.05 }, 6.1);
tl.to("#j-eyes-shocked", { opacity: 1, duration: 0.05 }, 6.1);
tl.to("#j-mouth-smirk", { opacity: 0, duration: 0.05 }, 6.1);
tl.to("#j-mouth-shocked", { opacity: 1, duration: 0.05 }, 6.1);

// Eyebrows up
tl.to("#j-brow-l", { attr: { y1: 72, y2: 69 }, duration: 0.1, ease: "power3.out" }, 6.1);
tl.to("#j-brow-r", { attr: { y1: 69, y2: 72 }, duration: 0.1, ease: "power3.out" }, 6.1);

// Glasses shake
tl.to("#j-glasses", { x: 3, rotation: 4, transformOrigin: "50% 50%", duration: 0.08 }, 6.1);
tl.to("#j-glasses", { x: -2, rotation: -2, duration: 0.08 }, 6.18);
tl.to("#j-glasses", { x: 0, rotation: 0, duration: 0.1 }, 6.26);

// Jensen recoils
tl.to("#jensen-char", { x: -20, duration: 0.15, ease: "power3.out" }, 6.1);

// Sweat drops
tl.to("#sweat1", { opacity: 1, y: -40, x: -15, duration: 0.3, ease: "power2.out" }, 6.3);
tl.to("#sweat2", { opacity: 1, y: -50, x: 20, duration: 0.35, ease: "power2.out" }, 6.4);
tl.to("#sweat3", { opacity: 1, y: -60, x: 5, duration: 0.4, ease: "power2.out" }, 6.5);
tl.to("#sweat1", { y: 80, opacity: 0, duration: 0.5, ease: "power2.in" }, 6.8);
tl.to("#sweat2", { y: 90, opacity: 0, duration: 0.5, ease: "power2.in" }, 6.9);
tl.to("#sweat3", { y: 100, opacity: 0, duration: 0.5, ease: "power2.in" }, 7.0);

// --- PHASE 5: STORY TITLE (8-10.5s) ---

// Flash
tl.to("#flash-overlay", { opacity: 0.85, duration: 0.06 }, 8.0);
tl.to("#flash-overlay", { opacity: 0, duration: 0.4, ease: "power2.out" }, 8.06);

// Clear spy text
tl.to("#spy-text, #spy-mini", { opacity: 0, duration: 0.2 }, 8.0);

// Jensen recovers slightly, centered
tl.to("#jensen-char", { x: 0, opacity: 0.6, duration: 0.2 }, 8.0);

// Story bar smashes up
tl.to("#story-bar", { y: 0, duration: 0.25, ease: "power4.out" }, 8.1);

// Bar impact shake
tl.to("#story-bar", { x: 4, duration: 0.04 }, 8.35);
tl.to("#story-bar", { x: -3, duration: 0.04 }, 8.39);
tl.to("#story-bar", { x: 0, duration: 0.06 }, 8.43);

// Fade everything at end
tl.to("#scene-inner", { opacity: 0, duration: 0.3 }, 10.0);

// Hard kill
tl.set("#root", { opacity: 0, visibility: "hidden" }, 10.4);

window.__timelines["hook"] = tl;
</script>
</body>
</html>
