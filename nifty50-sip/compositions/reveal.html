<script>
  const stepEase = (base, dur, fps = 12) => {
    const e = gsap.parseEase(base);
    const n = Math.max(1, Math.round(dur * fps));
    return (p) => e(Math.floor(p * n) / n);
  };

  const tl = gsap.timeline({ paused: true });

  // Starburst spins in
  tl.fromTo("#starburst", {opacity:0, scale:0.3, rotation:-30}, {opacity:1, scale:1, rotation:0, duration:0.8, ease: stepEase("power2.out", 0.8)}, 0.2);
  tl.to("#starburst", {rotation:15, duration:9, ease:"none"}, 1.0);

  // Yellow circle EXPANDS with dramatic measured curve
  tl.set("#reveal-circle", {opacity:1, scale:0.05}, 0.5);
  tl.to("#reveal-circle", {scale:0.5, duration:0.2, ease: stepEase("power3.out", 0.2)}, 0.5);
  tl.to("#reveal-circle", {scale:0.85, duration:0.15, ease: stepEase("power2.out", 0.15)}, 0.7);
  tl.to("#reveal-circle", {scale:1.0, duration:0.15, ease: stepEase("power2.out", 0.15)}, 0.85);

  // Glow ring expands with circle
  tl.fromTo("#glow-outer", {opacity:0, scale:0.6}, {opacity:1, scale:1, duration:0.5, ease:"power2.out"}, 0.7);

  // Circle shadow pulse
  tl.to("#reveal-circle", {boxShadow:"0 0 60px 20px rgba(255,230,25,0.3)", duration:0.5, ease:"power2.out"}, 1.0);

  // Text inside circle appears
  tl.fromTo("#rc-label", {opacity:0, y:10}, {opacity:1, y:0, duration:0.3, ease: stepEase("power2.out", 0.3)}, 1.3);
  tl.fromTo("#rc-amt", {opacity:0, scale:1.3}, {opacity:1, scale:1, duration:0.4, ease: stepEase("back.out(1.4)", 0.4)}, 1.6);
  tl.fromTo("#rc-sub", {opacity:0, y:-10}, {opacity:1, y:0, duration:0.3, ease: stepEase("power2.out", 0.3)}, 2.2);

  // CONFETTI BURST — 12 particles explode outward
  const confetti = [];
  for (let i = 1; i <= 12; i++) confetti.push("#cf" + i);
  const cfDx = [-80, 60, -120, 140, -160, 180, -200, 170, -50, 90, -140, 130];
  const cfDy = [-200, -180, -160, -140, 80, -190, 60, 100, -220, 120, 90, -170];
  const cfRot = [45, -30, 60, -45, 30, -60, 50, -40, 35, -55, 25, -35];
  confetti.forEach((c, i) => {
    tl.fromTo(c, {opacity:0, x:0, y:0, rotation:0},
      {opacity:0.8, x: cfDx[i], y: cfDy[i], rotation: cfRot[i], duration:0.5, ease: stepEase("power2.out", 0.5)}, 1.6);
    tl.to(c, {opacity:0, y: cfDy[i] + 100, duration:1.5, ease:"power2.in"}, 2.1);
  });

  // Summary cards pop in staggered with bounce
  tl.fromTo("#sm-invested", {opacity:0, scale:0.85, y:20}, {opacity:1, scale:1, y:0, duration:0.35, ease: stepEase("back.out(1.6)", 0.35)}, 2.8);
  tl.fromTo("#sm-years", {opacity:0, scale:0.85, y:20}, {opacity:1, scale:1, y:0, duration:0.35, ease: stepEase("back.out(1.6)", 0.35)}, 3.3);
  tl.fromTo("#sm-gain", {opacity:0, scale:0.85, y:20}, {opacity:1, scale:1, y:0, duration:0.35, ease: stepEase("back.out(1.6)", 0.35)}, 3.8);
  tl.fromTo("#sm-multiplier", {opacity:0, scale:0.85, y:20}, {opacity:1, scale:1, y:0, duration:0.35, ease: stepEase("back.out(1.6)", 0.35)}, 4.3);
  tl.fromTo("#sm-nifty-start", {opacity:0, scale:0.85, y:20}, {opacity:1, scale:1, y:0, duration:0.35, ease: stepEase("back.out(1.6)", 0.35)}, 5.3);
  tl.fromTo("#sm-nifty-end", {opacity:0, scale:0.85, y:20}, {opacity:1, scale:1, y:0, duration:0.35, ease: stepEase("back.out(1.6)", 0.35)}, 5.8);

  // Final years
  tl.fromTo("#final-row", {opacity:0, y:20}, {opacity:1, y:0, duration:0.5, ease: stepEase("power2.out", 0.5)}, 6.8);

  // Circle gentle pulse
  tl.to("#reveal-circle", {scale:1.03, duration:2, ease:"sine.inOut"}, 4.0);
  tl.to("#reveal-circle", {scale:1.0, duration:2, ease:"sine.inOut"}, 6.0);

  // Glow ring pulses
  tl.to("#glow-outer", {scale:1.05, opacity:0.5, duration:2, ease:"sine.inOut"}, 4.0);
  tl.to("#glow-outer", {scale:1.0, opacity:1, duration:2, ease:"sine.inOut"}, 6.0);

  // Fade out
  tl.to("#root", {opacity:0, duration:0.5, ease:"power2.in"}, 9.3);
  tl.set("#root", {opacity:0, visibility:"hidden"}, 9.8);

  window.__timelines["reveal"] = tl;
</script>
