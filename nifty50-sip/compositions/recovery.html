<script>
  const stepEase = (base, dur, fps = 12) => {
    const e = gsap.parseEase(base);
    const n = Math.max(1, Math.round(dur * fps));
    return (p) => e(Math.floor(p * n) / n);
  };

  const tl = gsap.timeline({ paused: true });
  const s = 500 / 200000; // Scale

  // Title
  tl.fromTo("#rec-title", {opacity:0, x:-30}, {opacity:1, x:0, duration:0.5, ease: stepEase("power2.out", 0.5)}, 0.2);

  // Bounce label — big pop
  tl.fromTo("#rec-bounce", {opacity:0, scale:1.5, y:-20}, {opacity:1, scale:1, y:0, duration:0.4, ease: stepEase("back.out(1.8)", 0.4)}, 0.8);

  // Progress bar fills across the scene
  tl.fromTo("#prog-fill", {width:"0%"}, {width:"100%", duration:10, ease:"none"}, 1.0);

  // Bar pairs grow sequentially
  const invH = [40000*s, 50000*s, 60000*s, 70000*s, 80000*s, 90000*s];
  const pfH = [57508*s, 79592*s, 67553*s, 99035*s, 116449*s, 166154*s];
  const invIds = ["#bi-09","#bi-10","#bi-11","#bi-12","#bi-13","#bi-14"];
  const pfIds = ["#bp-09","#bp-10","#bp-11","#bp-12","#bp-13","#bp-14"];

  for (let i = 0; i < 6; i++) {
    const t = 1.8 + i * 1.3;
    tl.fromTo(invIds[i], {height:0, y:0}, {height: invH[i], y: -invH[i], duration:0.5, ease: stepEase("power2.out", 0.5)}, t);
    tl.fromTo(pfIds[i], {height:0, y:0}, {height: pfH[i], y: -pfH[i], duration:0.6, ease: stepEase("power2.out", 0.6)}, t + 0.15);
  }

  // Green arrows float up at milestones
  tl.fromTo("#arr-1", {opacity:0, y:40}, {opacity:0.2, y:-40, duration:1.5, ease:"power2.out"}, 2.5);
  tl.fromTo("#arr-2", {opacity:0, y:40}, {opacity:0.2, y:-40, duration:1.5, ease:"power2.out"}, 5.0);
  tl.fromTo("#arr-3", {opacity:0, y:40}, {opacity:0.2, y:-40, duration:1.5, ease:"power2.out"}, 8.0);

  // Milestone cards pop with bounce

  tl.fromTo("#rec-m-2012", {opacity:0, scale:0.8, y:20}, {opacity:1, scale:1, y:0, duration:0.4, ease: stepEase("back.out(1.6)", 0.4)}, 6.0);
  tl.fromTo("#rec-m-2014", {opacity:0, scale:0.8, y:20}, {opacity:1, scale:1, y:0, duration:0.4, ease: stepEase("back.out(1.6)", 0.4)}, 9.0);

  // Fade out
  tl.to("#root", {opacity:0, duration:0.4, ease:"power2.in"}, 12.4);
  tl.set("#root", {opacity:0, visibility:"hidden"}, 12.8);

  window.__timelines["recovery"] = tl;
</script>
