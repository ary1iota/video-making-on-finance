<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="../assets/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #root {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #1A1A1A; position: relative;
    font-family: 'Inter', sans-serif;
  }
  .inner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
  }

  #cta-follow {
    font-size: 72px; color: #FFE619;
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  #cta-sub {
    font-size: 36px; color: #ffffff;
    font-family: 'Inter', sans-serif; font-weight: 700;
    text-align: center; max-width: 900px; line-height: 1.4;
  }
  #cta-comment {
    font-size: 28px; color: #b0b5ba;
    font-family: 'Space Mono', monospace;
    text-align: center;
  }

  /* Social icons row */
  #social-row {
    display: flex; gap: 40px; margin-top: 16px;
  }
  .social-icon {
    width: 64px; height: 64px; border-radius: 50%;
    background: #2a2a2a; display: flex; align-items: center;
    justify-content: center; font-size: 28px; color: #ffffff;
    opacity: 0;
  }

  /* Yellow accent bar */
  #accent-bar {
    position: absolute; bottom: 0; left: 0; width: 0; height: 8px;
    background: #FFE619;
  }
</style>
</head>
<body>
<div id="root" data-composition-id="cta" data-start="0" data-duration="5" data-width="1920" data-height="1080">
  <div class="inner" id="scene-inner">
    <div id="cta-follow">FOLLOW FOR MORE</div>
    <div id="cta-sub">Finance breakdowns that actually make sense.</div>
    <div id="cta-comment">Drop a comment: Who should be NVIDIA's next CEO?</div>
    <div id="social-row">
      <div class="social-icon" id="icon-ig">IG</div>
      <div class="social-icon" id="icon-yt">YT</div>
      <div class="social-icon" id="icon-tt">TT</div>
    </div>
  </div>
  <div id="accent-bar"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// Fade in
tl.to("#scene-inner", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

// Follow text
tl.fromTo("#cta-follow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.2);

// Sub text
tl.fromTo("#cta-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.6);

// Comment prompt
tl.fromTo("#cta-comment", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.0);

// Social icons pop in
tl.to("#icon-ig", { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.4);
tl.fromTo("#icon-ig", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.4);
tl.to("#icon-yt", { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.6);
tl.fromTo("#icon-yt", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.6);
tl.to("#icon-tt", { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.8);
tl.fromTo("#icon-tt", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.8);

// Yellow bar wipe
tl.to("#accent-bar", { width: "100%", duration: 2.0, ease: "power1.inOut" }, 0.5);

window.__timelines["cta"] = tl;
</script>
</body>
</html>
