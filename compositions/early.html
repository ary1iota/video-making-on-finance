<script>
  const stepEase = (base, dur, fps = 12) => {
    const e = gsap.parseEase(base);
    const n = Math.max(1, Math.round(dur * fps));
    return (p) => e(Math.floor(p * n) / n);
  };

  const tl = gsap.timeline({ paused: true });

  /*
   * RETIMED for 18s duration (video 8-26s).
   * Narration landmarks (local scene time):
   *   t≈0.0  "The year is 2006"
   *   t≈3.4  "first ten thousand" ends
   *   t≈5.2  "nearly 40 percent" ends
   *   t≈9.5  "past 37 thousand" ends (2007)
   *   t≈11.2 "Then 2008 hits"
   *   t≈14.4 "over 50 percent" ends
   *   t≈16.0 "twenty-two thousand" ends
   *   t≈16.9 "But you don't stop"
   */

  // === PHASE 1: 2006 — instant entry (0s - 5.0s) ===

  // Ticker slides in immediately
  tl.fromTo("#ticker", {opacity:0, y:-46}, {opacity:1, y:0, duration:0.25, ease:"power2.out"}, 0.1);
  tl.fromTo("#ticker-inner", {x:0}, {x:-2400, duration:17, ease:"none"}, 0.3);

  // Title appears fast
  tl.fromTo("#early-title", {opacity:0, x:-30}, {opacity:1, x:0, duration:0.35, ease: stepEase("power2.out", 0.35)}, 0.2);

  // Timeline track appears
  tl.fromTo("#tl-track", {opacity:0}, {opacity:1, duration:0.25}, 0.3);

  // 2006 hero card FLIES in
  tl.fromTo("#hero-06", {opacity:0, x:-60, scale:0.9}, {opacity:1, x:0, scale:1, duration:0.4, ease: stepEase("back.out(1.4)", 0.4)}, 0.4);
  tl.fromTo("#bar-06", {width:"0%"}, {width:"40%", duration:0.5, ease: stepEase("power2.out", 0.5)}, 0.8);

  // Investment meter fades in, 2006 row animates
  tl.fromTo("#invest-meter", {opacity:0, x:40}, {opacity:1, x:0, duration:0.35, ease:"power2.out"}, 0.5);
  tl.fromTo("#im-row-06", {opacity:0, x:20}, {opacity:1, x:0, duration:0.3, ease:"power2.out"}, 0.8);
  tl.fromTo("#im-fill-06", {width:"0%"}, {width:"46%", duration:0.5, ease: stepEase("power2.out", 0.5)}, 1.0);

  // Timeline progress to 2006
  tl.fromTo("#tl-progress", {width:"0%"}, {width:"15%", duration:0.4, ease:"power2.out"}, 0.7);
  tl.fromTo("#dot-06", {opacity:0, scale:0}, {opacity:1, scale:1, duration:0.2, ease:"back.out(2)"}, 1.0);

  // Subtle card breathing while narration plays
  tl.to("#hero-06", {y:-5, duration:1.5, ease:"sine.inOut", yoyo:true, repeat:1}, 2.0);

  // === PHASE 2: 2007 — swap at ~5.0s (narration: "nearly 40 percent" done) ===

  // 2006 card slides left and shrinks
  tl.to("#hero-06", {opacity:0, x:-100, scale:0.85, duration:0.35, ease:"power2.in"}, 5.0);

  // 2007 hero card slides in from right
  tl.fromTo("#hero-07", {opacity:0, x:80, scale:0.9}, {opacity:1, x:0, scale:1, duration:0.4, ease: stepEase("back.out(1.4)", 0.4)}, 5.3);
  tl.fromTo("#bar-07", {width:"0%"}, {width:"55%", duration:0.5, ease: stepEase("power2.out", 0.5)}, 5.6);

  // 2007 investment row
  tl.fromTo("#im-row-07", {opacity:0, x:20}, {opacity:1, x:0, duration:0.3, ease:"power2.out"}, 5.4);
  tl.fromTo("#im-fill-07", {width:"0%"}, {width:"100%", duration:0.5, ease: stepEase("power2.out", 0.5)}, 5.6);

  // Timeline progress to 2007
  tl.to("#tl-progress", {width:"50%", duration:0.5, ease:"power2.out"}, 5.3);
  tl.fromTo("#dot-07", {opacity:0, scale:0}, {opacity:1, scale:1, duration:0.2, ease:"back.out(2)"}, 5.7);

  // Card breathing during 2007 narration
  tl.to("#hero-07", {y:-4, duration:1.5, ease:"sine.inOut", yoyo:true, repeat:1}, 7.0);

  // === PHASE 3: 2008 CRASH — dramatic at ~11.0s (narration: "Then 2008 hits") ===

  // Ticker turns red
  tl.to("#ticker-inner", {color:"#ef4444", duration:0.15}, 10.8);
  tl.to("#ticker .ticker-tape, #ticker", {background:"#2a0000", duration:0.2}, 10.8);

  // 2007 card gets pushed away
  tl.to("#hero-07", {opacity:0, x:-100, scale:0.85, duration:0.3, ease:"power2.in"}, 11.0);

  // RED FLASH — screen shakes
  tl.to("#crash-flash", {backgroundColor:"rgba(239,68,68,0.25)", duration:0.08}, 11.2);
  tl.to("#crash-flash", {backgroundColor:"rgba(239,68,68,0.08)", duration:0.15}, 11.28);
  tl.to("#crash-flash", {backgroundColor:"rgba(239,68,68,0.18)", duration:0.08}, 11.43);
  tl.to("#crash-flash", {backgroundColor:"rgba(239,68,68,0)", duration:0.5}, 11.51);

  // Screen shake on the whole root
  tl.to("#root", {x:12, duration:0.05, ease:"none"}, 11.2);
  tl.to("#root", {x:-10, duration:0.05, ease:"none"}, 11.25);
  tl.to("#root", {x:7, duration:0.05, ease:"none"}, 11.3);
  tl.to("#root", {x:-4, duration:0.05, ease:"none"}, 11.35);
  tl.to("#root", {x:0, duration:0.05, ease:"none"}, 11.4);

  // GFC CRASH badge SLAMS in center
  tl.fromTo("#crash-badge", {opacity:0, scale:2.5, rotation:-8}, {opacity:1, scale:1, rotation:-3, duration:0.3, ease: stepEase("power3.out", 0.3)}, 11.3);
  tl.fromTo("#crash-sub", {opacity:0, y:20}, {opacity:1, y:0, duration:0.35, ease: stepEase("power2.out", 0.35)}, 11.7);

  // Crash badge fades after impact
  tl.to("#crash-badge", {opacity:0, scale:0.9, duration:0.4, ease:"power2.in"}, 12.6);
  tl.to("#crash-sub", {opacity:0, duration:0.3, ease:"power2.in"}, 12.6);

  // 2008 card appears after crash badge clears
  tl.fromTo("#hero-08", {opacity:0, y:-60, scale:1.1}, {opacity:1, y:0, scale:1, duration:0.4, ease: stepEase("power3.out", 0.4)}, 13.0);
  tl.fromTo("#bar-08", {width:"0%"}, {width:"52%", duration:0.5, ease: stepEase("power2.out", 0.5)}, 13.3);

  // 2008 investment row — bar shrinks dramatically
  tl.fromTo("#im-row-08", {opacity:0, x:20}, {opacity:1, x:0, duration:0.3, ease:"power2.out"}, 13.1);
  tl.fromTo("#im-fill-08", {width:"0%"}, {width:"60%", duration:0.5, ease: stepEase("power2.out", 0.5)}, 13.3);

  // Timeline progress completes — red for crash
  tl.to("#tl-progress", {width:"85%", background:"linear-gradient(90deg, #22c55e, #22c55e 60%, #ef4444)", duration:0.4, ease:"power2.out"}, 13.0);
  tl.fromTo("#dot-08", {opacity:0, scale:0}, {opacity:1, scale:1, duration:0.2, ease:"back.out(2)"}, 13.3);

  // === PHASE 4: Summary (15.5s - 17.2s) — "But you don't stop" ===

  // Summary strip slides up
  tl.fromTo("#early-summary", {opacity:0, y:30}, {opacity:1, y:0, duration:0.4, ease: stepEase("power2.out", 0.4)}, 15.5);

  // === FADE OUT ===
  tl.to("#root", {opacity:0, duration:0.4, ease:"power2.in"}, 17.2);
  tl.set("#root", {opacity:0, visibility:"hidden"}, 17.6);

  window.__timelines["early"] = tl;
</script>
