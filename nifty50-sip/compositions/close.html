<script>
  const stepEase = (base, dur, fps = 12) => {
    const e = gsap.parseEase(base);
    const n = Math.max(1, Math.round(dur * fps));
    return (p) => e(Math.floor(p * n) / n);
  };

  const tl = gsap.timeline({ paused: true });

  // Floating dots drift in
  const fds = ["#fd1","#fd2","#fd3","#fd4","#fd5","#fd6"];
  fds.forEach((f, i) => {
    tl.fromTo(f, {opacity:0}, {opacity:0.3, duration:0.5}, 0.1 + i * 0.15);
    tl.to(f, {y: -20 + (i % 2 ? 40 : 0), x: (i % 2 ? -15 : 15), duration:6, ease:"none"}, 0.5);
  });

  // Line 1 — slides in from left
  tl.fromTo("#line-1", {opacity:0, x:-60}, {opacity:1, x:0, duration:0.4, ease: stepEase("power2.out", 0.4)}, 0.3);

  // Line 2 — slides in from right
  tl.fromTo("#line-2", {opacity:0, x:60}, {opacity:1, x:0, duration:0.4, ease: stepEase("power2.out", 0.4)}, 0.9);

  // Line 3 — SLAMS in with scale

  // Yellow highlight sweep

  // Underline draws

  // Stats row — pops in

  // Tagline fades in with elegance
